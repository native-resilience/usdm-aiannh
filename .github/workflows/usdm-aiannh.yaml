# Workflow modeled on sustainable-fsa/usdm-counties (conda-forge geospatial setup).
name: update
run-name: Update the USDM AIANNH Aggregation Archive

on:
  schedule:
    - cron: '30 14 * * 4'  # 14:30 UTC = 7:30/8:30 AM MT, every Thursday
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['**.R', '**.Rmd', '.github/workflows/**']

permissions:
  contents: write

concurrency:
  group: archive-${{ github.repository }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash -l {0}

jobs:
  update:
    name: update-usdm-aiannh
    runs-on: macos-latest
    timeout-minutes: 350
    steps:
      - uses: mt-climate-office/actions/setup-geospatial@v1

      - name: Update archive
        run: Rscript usdm-aiannh.R

      - name: Commit and push
        run: |
          git config --local user.name "$GITHUB_ACTOR"
          git config --local user.email "$GITHUB_ACTOR@users.noreply.github.com"
          git add .
          git commit --allow-empty -m 'weekly update'
          git push
